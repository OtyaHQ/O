name: Next CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          # Flutter + Android toolchains fill the runner disk; avoid duplicating them in a cache archive.
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify APK output
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
          du -h build/app/outputs/flutter-apk/app-debug.apk

      # GitHub Actions artifact storage is intentionally best-effort. Normal
      # pushes validate/build without consuming artifact quota. A manual run can
      # temporarily expose the APK while the canonical private delivery path is
      # moved to OTYA/R2.
      - name: Keep installable debug APK for manual runs
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Free large Android build-only files before action post-job cache saves.
      # The APK is verified above and, for manual runs, uploaded before cleanup.
      - name: Reclaim runner disk before cache cleanup
        if: always()
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          rm -rf build "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/cmake" "$HOME/.gradle/caches" "$HOME/.gradle/daemon"
          df -h "$GITHUB_WORKSPACE" "$HOME"
